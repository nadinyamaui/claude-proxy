name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Covers the `engines.node: >=20` claim in package.json.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        # One Node version is enough for a formatting check.
        if: matrix.node == '24'
        run: npm run format:check

      - name: Lint
        if: matrix.node == '24'
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Confirm the built server starts and serves /health
        env:
          PORT: 8799
          PROXY_TOKEN: ci-smoke-token
        run: |
          node dist/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl -sf "http://127.0.0.1:$PORT/health" >/dev/null; then
              curl -s "http://127.0.0.1:$PORT/health"
              exit 0
            fi
            sleep 0.5
          done

          echo "server did not become healthy in time" >&2
          exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit production and dev dependencies
        run: npm audit --audit-level=high
